<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>免费PDF工具箱| 不上传文件</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: system-ui, 'Segoe UI', -apple-system, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 16px;
            color: #1e293b;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .badge {
            background: #10b981;
            color: white;
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 40px;
        }
        .tips-box {
            background: #fef9e3;
            border-left: 4px solid #f59e0b;
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            font-size: 0.8rem;
        }
        .tips-box p {
            margin: 6px 0;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            touch-action: manipulation;
        }
        button.primary {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }
        button.danger {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
        }
        .file-list {
            background: white;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eef2ff;
        }
        .file-name {
            font-size: 0.85rem;
            word-break: break-word;
            flex: 1;
        }
        .remove-btn {
            background: #fee2e2;
            border: none;
            color: #ef4444;
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.7rem;
        }
        .result-area {
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            margin-top: 20px;
        }
        .donate {
            background: white;
            border-radius: 24px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 30px;
        }
        @media (max-width: 640px) {
            button { padding: 10px 14px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="container">
<h1>📄 免费PDF工具箱 <span class="badge">不上传文件</span></h1>

    <!-- 重要提示：WPS和微信用户 -->
    <div class="tips-box">
        <p><strong>📱 WPS用户：</strong> 请先在WPS里「分享」→「保存到手机」，再从文件夹上传。</p >
        <p><strong>💬 微信用户：</strong> 点击右上角「···」→「在浏览器中打开」获得完整功能。</p >
        <p><strong>✅ 提示：</strong> 可多次点击「添加PDF」，不会覆盖已有文件。</p >
    </div>

    <div class="toolbar">
        <input type="file" id="fileInput" multiple accept=".pdf" style="display:none;">
        <button id="addFileBtn" class="primary">📂 添加PDF文件</button>
        <button id="mergeBtn" class="primary">🔗 合并</button>
        <button id="compressBtn">⚡ 压缩</button>
        <button id="extractBtn">✂️ 提取</button>
        <button id="clearAllBtn" class="danger">🗑️ 清空</button>
    </div>

    <div class="file-list" id="fileList">📭 暂无文件</div>
    <div class="result-area" id="resultMsg">✅ 就绪</div>

    <div class="donate">
        💖 如果帮到你<br>
        <div id="donateText"></div>
    </div>
    <footer>纯本地处理 · 文件不上传服务器</footer>
</div>

<script>
    let pdfFiles = [];
    const fileInput = document.getElementById('fileInput');
    const addFileBtn = document.getElementById('addFileBtn');
    const fileListDiv = document.getElementById('fileList');
    const mergeBtn = document.getElementById('mergeBtn');
    const compressBtn = document.getElementById('compressBtn');
    const extractBtn = document.getElementById('extractBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const resultMsg = document.getElementById('resultMsg');

    function showMessage(msg, isError = false) {
        resultMsg.innerHTML = isError ? `⚠️ ${msg}` : `✅ ${msg}`;
        setTimeout(() => {
            if (resultMsg.innerHTML === `✅ ${msg}`) resultMsg.innerHTML = '✨ 就绪';
        }, 2500);
    }

    function renderFileList() {
        if (pdfFiles.length === 0) {
            fileListDiv.innerHTML = '📭 暂无文件';
            return;
        }
        let html = `<strong>📎 ${pdfFiles.length} 个文件</strong><br><br>`;
        pdfFiles.forEach((file, idx) => {
            const sizeKB = (file.size / 1024).toFixed(1);
            html += `
                <div class="file-item">
                    <div class="file-name">📄 ${escapeHtml(file.name)} (${sizeKB}KB)</div>
                    <button class="remove-btn" data-index="${idx}">删除</button>
                </div>
            `;
        });
        fileListDiv.innerHTML = html;
        document.querySelectorAll('.remove-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.getAttribute('data-index'));
                pdfFiles.splice(idx, 1);
                renderFileList();
                showMessage(`已移除，剩余 ${pdfFiles.length} 个`);
            });
        });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;');
        });
    }

    async function addFiles(files) {
        let added = 0;
        let invalid = 0;
        for (let f of files) {
            if (f.type === 'application/pdf') {
                // 额外验证：尝试读取文件头
                try {
                    const buffer = await f.slice(0, 5).arrayBuffer();
                    const header = String.fromCharCode(...new Uint8Array(buffer));
                    if (header.includes('%PDF')) {
                        pdfFiles.push(f);
                        added++;
                    } else {
                        invalid++;
                    }
                } catch(e) {
                    invalid++;
                }
            } else {
                showMessage(`跳过非PDF: ${f.name}`, true);
            }
        }
        if (added) {
            renderFileList();
            showMessage(`✅ 添加 ${added} 个PDF，共 ${pdfFiles.length} 个`);
        }
        if (invalid > 0) {
            showMessage(`⚠️ ${invalid} 个文件无效，可能来自WPS，请先「保存到手机」再上传`, true);
}
    }

    addFileBtn.addEventListener('click', () => {
        fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            addFiles(e.target.files);
        }
        fileInput.value = '';
    });

    clearAllBtn.addEventListener('click', () => {
        if (pdfFiles.length === 0) {
            showMessage('没有文件可清空', true);
            return;
        }
        pdfFiles = [];
        renderFileList();
        showMessage('已清空');
    });

    mergeBtn.addEventListener('click', async () => {
        if (pdfFiles.length < 2) {
            showMessage(`至少需要2个PDF，当前 ${pdfFiles.length} 个`, true);
            return;
        }
        showMessage(`🔄 合并中...`);
        try {
            const { PDFDocument } = PDFLib;
            const mergedPdf = await PDFDocument.create();
            for (let file of pdfFiles) {
                const arrayBuffer = await file.arrayBuffer();
                const pdfDoc = await PDFDocument.load(arrayBuffer);
                const pages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
                pages.forEach(page => mergedPdf.addPage(page));
            }
            const pdfBytes = await mergedPdf.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            saveAs(blob, `merged_${Date.now()}.pdf`);
            showMessage(`🎉 合并成功！`);
        } catch (err) {
            showMessage('合并失败，文件可能损坏或过大', true);
        }
    });

    compressBtn.addEventListener('click', async () => {
        if (pdfFiles.length === 0) {
            showMessage('请先添加PDF', true);
            return;
        }
        const file = pdfFiles[0];
        showMessage(`压缩中...`);
        try {
            const { PDFDocument } = PDFLib;
            const arrayBuffer = await file.arrayBuffer();
            const pdfDoc = await PDFDocument.load(arrayBuffer);
            const pdfBytes = await pdfDoc.save({ useObjectStreams: true });
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            saveAs(blob, `compressed_${file.name}`);
            showMessage(`压缩完成`);
        } catch (err) {
            showMessage('压缩失败', true);
        }
    });

    extractBtn.addEventListener('click', async () => {
        if (pdfFiles.length === 0) {
            showMessage('请先添加PDF', true);
            return;
        }
        const input = prompt('输入页码，如 1,3,5 或 2-4');
        if (!input) return;
        const file = pdfFiles[0];
        try {
            const { PDFDocument } = PDFLib;
            const arrayBuffer = await file.arrayBuffer();
            const srcDoc = await PDFDocument.load(arrayBuffer);
            const total = srcDoc.getPageCount();
            let pages = [];
            const parts = input.split(',');
            for (let part of parts) {
                part = part.trim();
                if (part.includes('-')) {
                    let [s, e] = part.split('-').map(Number);
                    for (let i = s; i <= e; i++) pages.push(i);
                } else {
                    let p = parseInt(part);
                    if (!isNaN(p)) pages.push(p);
                }
            }
            pages = pages.filter(p => p >= 1 && p <= total);
            if (pages.length === 0) throw new Error();
            const newPdf = await PDFDocument.create();
            const copyPages = await newPdf.copyPages(srcDoc, pages.map(p => p-1));
            copyPages.forEach(page => newPdf.addPage(page));
            const pdfBytes = await newPdf.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            saveAs(blob, `extracted_${file.name}`);
            showMessage(`提取成功！${pages.length}页`);
        } catch (err) {
            showMessage('提取失败', true);
        }
    });

    // 赞赏码
    const donateDiv = document.getElementById('donateText');
